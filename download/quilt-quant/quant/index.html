<script type="module">
// download/quilt-quant/engine/context.js
function emptyContext() {
  return {
    trace: [],
    timestamp: Date.now()
  };
}
function extendContext(parent, childId, extra) {
  return {
    ...parent,
    ...extra,
    caller: childId,
    trace: [...parent.trace ?? [], parent.caller ?? "<root>"],
    timestamp: Date.now()
  };
}
function contextKey(ctx) {
  const parts = [];
  if (ctx.row !== undefined)
    parts.push(`r:${String(ctx.row)}`);
  if (ctx.column !== undefined)
    parts.push(`c:${String(ctx.column)}`);
  if (ctx.caller)
    parts.push(`f:${ctx.caller}`);
  if (ctx.identity?.id)
    parts.push(`i:${ctx.identity.id}`);
  if (ctx.identity?.tags?.length)
    parts.push(`t:${ctx.identity.tags.sort().join(",")}`);
  return parts.join("|") || "<default>";
}
function evalWhen(when, ctx) {
  try {
    const caller = {
      row: ctx.row,
      column: ctx.column,
      sheet: ctx.sheet,
      identity: ctx.identity,
      metadata: ctx.metadata
    };
    const expr = when.replace(/([\w.]+)\s+contains\s+"([^"]+)"/g, 'Array.isArray($1) && $1.includes("$2")');
    const fn = new Function("caller", `return (${expr});`);
    return Boolean(fn(caller));
  } catch (err) {
    if (process.env.QUILT_DEBUG) {
      console.error(`[quilt] evalWhen failed: ${when}`, err);
    }
    return false;
  }
}
function stableJson(v) {
  if (v === null || typeof v !== "object")
    return JSON.stringify(v) ?? "null";
  if (Array.isArray(v))
    return `[${v.map(stableJson).join(",")}]`;
  const keys = Object.keys(v).sort();
  return `{${keys.map((k) => `${JSON.stringify(k)}:${stableJson(v[k])}`).join(",")}}`;
}
function callKey(ctx, input) {
  const base = contextKey(ctx);
  if (input === undefined)
    return base;
  return `${base}|in:${stableJson(input)}`;
}

// download/quilt-quant/engine/cells/value.js
function evaluateValue(cell, _ctx) {
  return {
    data: cell.def.value,
    status: "ready",
    computedAt: Date.now()
  };
}

// download/quilt-quant/engine/cells/formula.js
function compile(expr, knownIds) {
  let body = expr.startsWith("=") ? expr.slice(1) : expr;
  const sortedIds = Array.from(knownIds).sort((a, b) => b.length - a.length);
  for (const id of sortedIds) {
    const safe = id.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`(?<![A-Za-z0-9_])${safe}(?![A-Za-z0-9_])`, "g");
    body = body.replace(re, `cells[${JSON.stringify(id)}]`);
  }
  return new Function("cells", "abs", "min", "max", "clamp", "caller", `with (cells) { return (${body}); }`);
}
var helperAbs = (n) => Math.abs(n);
var helperMin = (...n) => Math.min(...n);
var helperMax = (...n) => Math.max(...n);
var helperClamp = (n, lo, hi) => Math.min(Math.max(n, lo), hi);
function evaluateFormula(cell, ctx, allCells) {
  if (!cell.def.expr) {
    return { data: undefined, status: "error", error: { message: "formula cell has no expr" } };
  }
  const key = contextKey(ctx);
  const cached = cell.contextCache.get(key);
  if (cached && cached.status === "ready" && !cell.value.error) {
    return cached;
  }
  try {
    const cellValues = {};
    for (const [id, other] of allCells) {
      cellValues[id] = other.value.data;
    }
    const cellProxy = new Proxy(cellValues, {
      get(target, prop) {
        if (typeof prop === "string" && prop in target) {
          return target[prop];
        }
        return;
      },
      has(target, prop) {
        if (typeof prop === "string")
          return prop in target;
        return false;
      }
    });
    const fn = compile(cell.def.expr, allCells.keys());
    const result = fn(cellProxy, helperAbs, helperMin, helperMax, helperClamp, ctx);
    const value = {
      data: result,
      status: "ready",
      computedAt: Date.now()
    };
    cell.contextCache.set(key, value);
    cell.value = value;
    return value;
  } catch (err) {
    const message = err instanceof Error ? err.message : String(err);
    if (process.env.QUILT_DEBUG) {
      console.error(`[quilt] formula ${cell.id} failed:`, err);
    }
    return { data: undefined, status: "error", error: { message } };
  }
}

// download/quilt-quant/engine/cells/api.js
var defaultExecutor = {
  fetch: (input, init) => globalThis.fetch(input, init)
};
async function evaluateApi(cell, ctx, input, executor = defaultExecutor) {
  const startedAt = Date.now();
  if (!cell.def.endpoint) {
    return { data: undefined, status: "error", error: { message: "api cell has no endpoint" } };
  }
  try {
    if (cell.def.endpoint.startsWith("model:")) {
      return await callModel(cell, ctx, input, executor, startedAt);
    }
    if (cell.def.endpoint.startsWith("mcp://")) {
      return await callMcpTool(cell, ctx, input, startedAt);
    }
    const url = substitute(cell.def.endpoint, ctx);
    const method = cell.def.method ?? "GET";
    const headers = cell.def.headers ?? { "Content-Type": "application/json" };
    const init = { method, headers };
    if (method !== "GET" && method !== "HEAD" && input !== undefined) {
      init.body = typeof input === "string" ? input : JSON.stringify(input);
    }
    const response = await executor.fetch(url, init);
    const duration = Date.now() - startedAt;
    if (!response.ok) {
      return {
        data: undefined,
        status: "error",
        error: { message: `HTTP ${response.status} ${response.statusText}` }
      };
    }
    const contentType = response.headers.get("content-type") ?? "";
    const data = contentType.includes("application/json") ? await response.json() : await response.text();
    return {
      data,
      status: "ready",
      computedAt: Date.now(),
      effects: [{ kind: "network", url, method }, { kind: "compute", ms: duration }]
    };
  } catch (err) {
    const message = err instanceof Error ? err.message : String(err);
    return { data: undefined, status: "error", error: { message } };
  }
}
async function callModel(cell, _ctx, _input, _executor, startedAt) {
  return {
    data: { model: cell.def.endpoint, note: "model calls not yet implemented" },
    status: "ready",
    computedAt: Date.now(),
    effects: [{ kind: "model", provider: cell.def.endpoint ?? "" }, { kind: "compute", ms: Date.now() - startedAt }]
  };
}
async function callMcpTool(cell, _ctx, _input, startedAt) {
  return {
    data: { tool: cell.def.endpoint, note: "MCP tool calls not yet implemented" },
    status: "ready",
    computedAt: Date.now(),
    effects: [{ kind: "network", url: cell.def.endpoint ?? "", method: "MCP" }, { kind: "compute", ms: Date.now() - startedAt }]
  };
}
function substitute(template, ctx) {
  return template.replace(/\{\{([^}]+)\}\}/g, (_, path) => {
    const parts = path.trim().split(".");
    let value = ctx;
    for (const p of parts) {
      if (value && typeof value === "object" && p in value) {
        value = value[p];
      } else {
        return "";
      }
    }
    return String(value ?? "");
  });
}

// download/quilt-quant/engine/cells/program.js
async function evaluateProgram(cell, ctx, input, runtime) {
  if (!cell.def.code) {
    return { data: undefined, status: "error", error: { message: "program cell has no code" } };
  }
  try {
    const AsyncFunction = Object.getPrototypeOf(async function() {}).constructor;
    const fn = new AsyncFunction("input", "caller", "runtime", "clamp", "abs", "min", "max", cell.def.code);
    const clamp = (n, lo, hi) => Math.min(Math.max(n, lo), hi);
    const result = await fn(input, ctx, runtime, clamp, Math.abs, Math.min, Math.max);
    return {
      data: result,
      status: "ready",
      computedAt: Date.now()
    };
  } catch (err) {
    const message = err instanceof Error ? err.message : String(err);
    if (process.env.QUILT_DEBUG) {
      console.error(`[quilt] program cell ${cell.id} failed:`, err);
    }
    return { data: undefined, status: "error", error: { message } };
  }
}

// download/quilt-quant/engine/cells/router.js
async function evaluateRouter(cell, ctx, input, runtime) {
  if (!cell.def.rules?.length) {
    return { data: undefined, status: "error", error: { message: "router cell has no rules" } };
  }
  for (const rule of cell.def.rules) {
    if (evalWhen(rule.when, ctx)) {
      if (typeof rule.route === "string") {
        return await runtime.call(rule.route, input, ctx);
      }
      if (typeof rule.route === "object" && "cell" in rule.route) {
        const result = await runtime.call(rule.route.cell, input, ctx);
        if (rule.route.with && result.status === "ready" && result.data && typeof result.data === "object") {
          return { ...result, data: { ...result.data, ...rule.route.with } };
        }
        return result;
      }
      if (typeof rule.route === "object" && "model" in rule.route) {
        return {
          data: { model: rule.route.model, input },
          status: "ready",
          computedAt: Date.now()
        };
      }
      if (typeof rule.route === "object" && "value" in rule.route) {
        return {
          data: rule.route.value,
          status: "ready",
          computedAt: Date.now()
        };
      }
    }
  }
  return {
    data: undefined,
    status: "ready",
    computedAt: Date.now()
  };
}

// download/quilt-quant/engine/cells/listener.js
var evtCounter = 0;
async function fireListener(cell, changedCellId, newValue, prevValue, runtime) {
  if (!cell.def.watch?.length)
    return false;
  if (!cell.def.watch.includes(changedCellId))
    return false;
  const ctx = emptyContext();
  ctx.caller = cell.id;
  ctx.metadata = { changed: changedCellId, prev: prevValue.data, current: newValue.data };
  if (cell.def.condition && !evalWhen(cell.def.condition, ctx)) {
    return false;
  }
  if (cell.def.action) {
    evtCounter += 1;
    const evtCtx = emptyContext();
    evtCtx.caller = cell.id;
    evtCtx.row = `evt-${Date.now()}-${evtCounter}`;
    evtCtx.metadata = { changed: changedCellId, prev: prevValue.data, current: newValue.data };
    await runtime.call(cell.def.action, { changed: changedCellId, value: newValue.data }, evtCtx);
  }
  return true;
}

// download/quilt-quant/engine/cells/sensor.js
function makeSensorValue(data) {
  return {
    data,
    status: "ready",
    computedAt: Date.now()
  };
}

// download/quilt-quant/engine/cells/io.js
function makeIoValue(data) {
  return {
    data,
    status: "ready",
    computedAt: Date.now()
  };
}

// download/quilt-quant/engine/cells/ai.js
async function evaluateAI(cell, _context, engine, resolveCellValue) {
  const substitute2 = (s) => {
    if (!resolveCellValue)
      return s;
    return s.replace(/\{\{\s*([a-zA-Z0-9_.-]+)\s*\}\}/g, (_match, id) => {
      const v = resolveCellValue(id);
      if (v === null || v === undefined)
        return "";
      if (typeof v === "string")
        return v;
      return JSON.stringify(v);
    });
  };
  const config = {
    id: cell.id,
    kind: "ai",
    ai_kind: cell.ai_kind,
    provider: cell.provider,
    model: cell.model
  };
  if (cell.prompt !== undefined)
    config.prompt = substitute2(cell.prompt);
  if (cell.input !== undefined) {
    config.input = cell.input.startsWith("{{") ? substitute2(cell.input) : cell.input;
  }
  if (cell.image !== undefined)
    config.image = substitute2(cell.image);
  if (cell.target !== undefined)
    config.target = cell.target;
  if (cell.language !== undefined)
    config.language = cell.language;
  if (cell.max_words !== undefined)
    config.max_words = cell.max_words;
  if (cell.temperature !== undefined)
    config.temperature = cell.temperature;
  if (cell.max_tokens !== undefined)
    config.max_tokens = cell.max_tokens;
  if (cell.system !== undefined)
    config.system = substitute2(cell.system);
  const HANDLED = new Set([
    "id",
    "kind",
    "ai_kind",
    "provider",
    "model",
    "prompt",
    "input",
    "image",
    "target",
    "language",
    "max_words",
    "temperature",
    "max_tokens",
    "system",
    "deps",
    "watch",
    "condition",
    "action",
    "code",
    "value",
    "default",
    "description"
  ]);
  for (const [k, v] of Object.entries(cell)) {
    if (HANDLED.has(k) || k in config)
      continue;
    const passthrough = v === null || typeof v === "number" || typeof v === "boolean" || typeof v === "string" && k !== "expr" || Array.isArray(v) && v.every((x) => typeof x !== "object" || x === null);
    if (passthrough)
      config[k] = v;
  }
  try {
    const result = await engine.call(config, { useCache: true });
    return { value: result, error: null };
  } catch (e) {
    const message = e instanceof Error ? e.message : String(e);
    return { value: null, error: message };
  }
}

// download/quilt-quant/engine/engine.js
var defaultOptions = {
  maxConcurrency: 16,
  tracing: false,
  eager: false
};

class QuiltEngine {
  id;
  cells = new Map;
  subscriptions = new Map;
  inflight = new Map;
  traces = [];
  options;
  subscriptionCounter = 0;
  constructor(id = "default", options = {}) {
    this.id = id;
    const { ai, ...rest } = options;
    this.options = { ...defaultOptions, ...rest, ai };
  }
  loadSheet(sheet) {
    this.cells.clear();
    this.inflight.clear();
    this.traces = [];
    for (const def of sheet.cells) {
      this.defineCell(def);
    }
    for (const cell of this.cells.values()) {
      if (cell.def.kind === "formula" || cell.def.kind === "ai") {
        this.autoDetectDeps(cell);
      }
      if (cell.def.kind === "listener") {
        for (const w of cell.def.watch ?? []) {
          this.addDep(cell.id, w);
        }
      }
      for (const dep of cell.def.deps ?? []) {
        this.addDep(cell.id, dep);
      }
    }
  }
  defineCell(def) {
    if (this.cells.has(def.id)) {
      throw new Error(`cell already defined: ${def.id}`);
    }
    let initial = { data: undefined, status: "idle" };
    if (def.value !== undefined) {
      initial = { data: def.value, status: "ready", computedAt: Date.now() };
    } else if (def.kind === "sensor" && def.default !== undefined) {
      initial = { data: def.default, status: "ready", computedAt: Date.now() };
    }
    const cell = {
      id: def.id,
      def,
      value: initial,
      dependencies: new Set,
      dependents: new Set,
      contextCache: new Map
    };
    this.cells.set(def.id, cell);
    return cell;
  }
  register(def) {
    const cell = this.defineCell(def);
    if (def.kind === "listener") {
      for (const w of def.watch ?? []) {
        this.addDep(def.id, w);
      }
    }
    for (const dep of def.deps ?? []) {
      this.addDep(def.id, dep);
    }
    return cell;
  }
  async get(id, ctx = emptyContext()) {
    const cell = this.cells.get(id);
    if (!cell) {
      return { data: undefined, status: "error", error: { message: `no such cell: ${id}` } };
    }
    const fullCtx = extendContext(ctx, id);
    switch (cell.def.kind) {
      case "value":
        return cell.value.status === "idle" ? evaluateValue(cell, fullCtx) : cell.value;
      case "formula": {
        await this.refreshDeps(cell, fullCtx);
        return evaluateFormula(cell, fullCtx, this.cells);
      }
      case "api":
      case "program":
      case "router":
      case "ai": {
        if (!cell.def.memo) {
          const value = await this.evaluateEffectful(cell, fullCtx, undefined);
          return value;
        }
        const key = contextKey(fullCtx);
        const cached = cell.contextCache.get(key);
        if (cached && cached.status === "ready") {
          return cached;
        }
        const value2 = await this.evaluateEffectful(cell, fullCtx, undefined);
        cell.contextCache.set(key, value2);
        return value2;
      }
      case "sensor":
      case "io":
      case "listener":
        return cell.value;

        return { data: undefined, status: "error", error: { message: `unknown kind: ${cell.def.kind}` } };
    }
  }
  async set(id, value, ctx = emptyContext()) {
    const cell = this.cells.get(id);
    if (!cell) {
      throw new Error(`no such cell: ${id}`);
    }
    const fullCtx = extendContext(ctx, id);
    const prev = cell.value;
    const newValue = {
      data: value,
      status: "ready",
      computedAt: Date.now()
    };
    cell.value = newValue;
    cell.contextCache.clear();
    await this.notify(id, newValue, prev);
    await this.propagate(id, fullCtx, undefined, prev);
  }
  async call(id, input, ctx = emptyContext()) {
    const cell = this.cells.get(id);
    if (!cell) {
      return { data: undefined, status: "error", error: { message: `no such cell: ${id}` } };
    }
    const fullCtx = extendContext(ctx, id);
    if (cell.def.kind === "value" || cell.def.kind === "formula") {
      return this.get(id, ctx);
    }
    if (cell.def.kind === "sensor" || cell.def.kind === "io" || cell.def.kind === "listener") {
      return cell.value;
    }
    const key = callKey(fullCtx, input);
    if (cell.def.memo) {
      const cached = cell.contextCache.get(key);
      if (cached && cached.status === "ready") {
        return cached;

      return this.inflight.get(inflightKey);
    }

    this.inflight.set(inflightKey, promise);

      const value = await promise;

      return value;

      throw new Error(`cannot push to ${cell.def.kind} cell: ${id}`);
    }
    const newValue = cell.def.kind === "sensor" ? makeSensorValue(data) : makeIoValue(data);
    const prev = cell.value;
    cell.value = newValue;
    await this.notify(id, newValue, prev);

    return this.traces.slice(-limit);

  exportDefs() {

      result = await evaluateApi(cell, ctx, input);

      const boundRuntime = {
        get: (id) => this.get(id, ctx),
        set: (id, value) => this.set(id, value, ctx),
        call: (id, i, c) => this.call(id, i, c ?? ctx)

      result = await evaluateRouter(cell, ctx, input, this);
    } else if (cell.def.kind === "ai") {
      if (!this.options.ai) {
        result = { data: null, status: "error", error: { message: "AI cell evaluated but no AI engine configured. Pass an `ai` engine to the QuiltEngine constructor." } };

        const resolved = new Set;

          if (resolved.has(id))
            return null;
          resolved.add(id);

          if (!c)
            return null;
          if (c.value.status === "ready")
            return c.value.data;
          if (c.value.status === "computing") {
            if (c.def.kind === "value") {
              c.value = evaluateValue(c, ctx);
              return c.value.data;
            }
            return null;
          }
          if (c.value.status === "error")
            return null;
          return c.value.data;
        };
        const aiResult = await evaluateAI(cell.def, ctx, this.options.ai, resolver);
        result = {
          data: aiResult.value,
          status: aiResult.error ? "error" : "ready",
          error: aiResult.error ? { message: aiResult.error } : undefined,
          effects: [{ kind: "model", provider: cell.def.provider || "unknown" }],
          computedAt: Date.now()
        };
      }
    } else {
      result = { data: undefined, status: "error", error: { message: `not effectful: ${cell.def.kind}` } };
    }
    if (this.options.tracing) {
      this.traces.push({
        cellId: cell.id,
        startedAt,
        completedAt: Date.now(),
        durationMs: Date.now() - startedAt,
        context: ctx,
        effects: result.effects,
        error: result.error
      });
    }
    const prev = cell.value;
    cell.value = result;
    await this.notify(cell.id, result, prev);
    return result;
  }
  async refreshDeps(cell, ctx) {
    for (const depId of cell.dependencies) {
      const dep = this.cells.get(depId);
      if (!dep)
        continue;
      if (dep.def.kind === "value" && dep.value.status !== "ready") {
        dep.value = evaluateValue(dep, ctx);
      } else if (dep.def.kind === "formula" && dep.value.status !== "ready") {
        await this.refreshDeps(dep, ctx);
        const v = evaluateFormula(dep, ctx, this.cells);
        dep.value = v;
        dep.contextCache.set(contextKey(ctx), v);
      }
    }

  async propagate(changedId, ctx, visited, changedPrev) {

    if (seen.has(changedId))
      return;
    seen.add(changedId);
    let current = cell.value;
    let prev = changedPrev ?? current;
    if (this.options.eager && cell.def.kind === "formula" && (cell.value.status === "stale" || cell.value.status === "idle")) {

function setupCanvas(cv, h) {

function linePath(ctx, arr, x0, x1, y0, y1, lo, hi) {
  const n = arr.length;

  for (let i = 0;i < n; i++) {
    const x = x0 + i / (n - 1) * (x1 - x0);
    const y = y1 - (arr[i] - lo) / (hi - lo || 1) * (y1 - y0);
    if (i === 0)
      ctx.moveTo(x, y);
    else
      ctx.lineTo(x, y);
  }
}

    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.fillText(v2.toFixed(0), 6, y + 3);
  }
  if (f) {
    ctx.strokeStyle = "#3a8fa0";
    ctx.lineWidth = 1.2;
    linePath(ctx, f.map((v2) => v2 ?? lo), X(0), X(closes.length - 1), Y(lo), Y(hi), lo, hi);
    ctx.stroke();
  }
  if (s) {
    ctx.strokeStyle = "#8a5aa0";
    ctx.lineWidth = 1.2;
    linePath(ctx, s.map((v2) => v2 ?? lo), X(0), X(closes.length - 1), Y(lo), Y(hi), lo, hi);
    ctx.stroke();
  }
  ctx.strokeStyle = "#2b2620";
  ctx.lineWidth = 1.4;
  linePath(ctx, closes, X(0), X(closes.length - 1), Y(lo), Y(hi), lo, hi);
  ctx.stroke();
  ctx.fillStyle = "#2e7d32";
  for (const t of st.bt?.trades ?? []) {
    ctx.beginPath();
    ctx.moveTo(X(t.entry), Y(closes[t.entry]) + 4);
    ctx.lineTo(X(t.entry) - 4, Y(closes[t.entry]) + 11);
    ctx.lineTo(X(t.entry) + 4, Y(closes[t.entry]) + 11);
    ctx.fill();
    ctx.fillStyle = "#b3402e";
    ctx.beginPath();
    ctx.moveTo(X(t.exit), Y(closes[t.exit]) - 4);
    ctx.lineTo(X(t.exit) - 4, Y(closes[t.exit]) - 11);
    ctx.lineTo(X(t.exit) + 4, Y(closes[t.exit]) - 11);
    ctx.fill();
    ctx.fillStyle = "#2e7d32";
  }
  ctx.fillStyle = "#8a7f6a";
  ctx.font = "10px ui-monospace,Menlo,monospace";
  ctx.fillText("tape · sma_fast · sma_slow · shaded = long (S3) · ▲ entry ▼ exit", pad.l, h - 5);

function drawEquity(st) {
  const cv = document.getElementById("cv-equity");
  const { ctx, w, h } = setupCanvas(cv, 130);
  const pad = { l: 46, r: 10, t: 8, b: 14 };
  const eq = st.bt?.equity, be = st.bnhEquity;
  ctx.clearRect(0, 0, w, h);
  if (!eq || !be)
    return;
  const all = [...eq, ...be];
  let lo = Math.min(...all), hi = Math.max(...all);
  const X = (i) => pad.l + i / (eq.length - 1) * (w - pad.l - pad.r);
  const Y = (v2) => h - pad.b - (v2 - lo) / (hi - lo || 1) * (h - pad.t - pad.b);
  ctx.strokeStyle = "#e3dac5";
  ctx.fillStyle = "#8a7f6a";
  ctx.font = "10px ui-monospace,Menlo,monospace";
  for (let g = 0;g <= 3; g++) {
    const v2 = lo + (hi - lo) * g / 3, y = Y(v2);
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(w - pad.r, y);
    ctx.stroke();
    ctx.fillText(v2.toFixed(0), 6, y + 3);
  }
  ctx.strokeStyle = "#b99b4e";
  ctx.lineWidth = 1.2;
  ctx.setLineDash([4, 3]);
  linePath(ctx, be, X(0), X(eq.length - 1), Y(lo), Y(hi), lo, hi);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = "#2e7d32";
  ctx.lineWidth = 1.6;
  linePath(ctx, eq, X(0), X(eq.length - 1), Y(lo), Y(hi), lo, hi);
  ctx.stroke();
  ctx.fillStyle = "#8a7f6a";
  ctx.fillText("equity — desk (green) vs buy & hold (dashed) · 10k start", pad.l, h - 3);
}
function drawDD(st) {
  const cv = document.getElementById("cv-dd");
  const { ctx, w, h } = setupCanvas(cv, 62);
  const pad = { l: 46, r: 10, t: 6, b: 10 };
  const eq = st.bt?.equity;
  ctx.clearRect(0, 0, w, h);
  if (!eq)
    return;
  const dd = [];
  let peak = eq[0];
  for (const x of eq) {
    peak = Math.max(peak, x);
    dd.push((peak - x) / peak);
  }
  const maxdd = Math.max(...dd, 0.01);
  const X = (i) => pad.l + i / (eq.length - 1) * (w - pad.l - pad.r);
  const Y = (v2) => pad.t + v2 / maxdd * (h - pad.t - pad.b);
  ctx.beginPath();
  ctx.moveTo(X(0), pad.t);
  for (let i = 0;i < dd.length; i++)
    ctx.lineTo(X(i), Y(dd[i]));
  ctx.lineTo(X(dd.length - 1), pad.t);
  ctx.closePath();
  ctx.fillStyle = "rgba(179,64,46,0.25)";
  ctx.fill();
  ctx.strokeStyle = "#b3402e";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0;i < dd.length; i++) {
    const x = X(i), y = Y(dd[i]);
    if (i === 0)
      ctx.moveTo(x, y);
    else
      ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = "#8a7f6a";
  ctx.font = "10px ui-monospace,Menlo,monospace";
  ctx.fillText(`drawdown · max ${(100 * (st.bt?.metrics?.maxdd ?? 0)).toFixed(1)}%`, pad.l, h - 1);
}
var fmtPct = (x) => x == null ? "—" : (100 * x).toFixed(1) + "%";
var fmtN = (x, d = 2) => x == null ? "—" : Number(x).toFixed(d);
function render(st) {

  bubble.innerHTML = st.flash?.text ? `<b>${btBad ? "REFUSED · " + st.bt.rule : promoted ? "PROMOTED" : "DESK"}</b> — ${st.flash.text}` : "<b>DESK</b> ready.";

    ["met.pf", "profit factor", fmtN(M.met_pf)],
    ["met.exposure", "exposure", fmtPct(M.met_exposure)],

  const wf = st.wf ?? {};

       <div><span class="qq-glass-label">art.equity.dd&nbsp;&nbsp;</span><span class="qq-spark bad">${art.dd}</span></div>` : "pull bt.run to light the glass";

async function refresh() {
  state = await snapshot();
  render(state);
}
async function nudge(id, dir) {
  const def = PARAM_DEFS.find((d) => d.id === id);
  const cur = Number(await get(id));
  const next = Math.max(def.min, Math.min(def.max, cur + dir * def.step));
  if (next === cur)
    return;
  await engine.set(id, next);
  refresh();
}
async function runTrainer() {

  trainerBusy = true;
  const btn = document.getElementById("btn-train");
  const gens = Number(document.getElementById("trainer-gens").value) || 24;
  const seed = Number(document.getElementById("trainer-seed").value) || 1 + Math.floor(Math.random() * 1e6);
  btn.textContent = `training ${gens} gens…`;
  btn.disabled = true;
  try {
    const t = await call("ai.trainer", { gens, seed });
    document.getElementById("trainer-result").textContent = t?.ok ? `${t.tried} candidates · ${t.kept} promotions · champion OOS ${t.champion.oos_score?.toFixed(3)}` : "trainer refused";
    await refresh();
    const card = document.getElementById("champion-card");
    card.classList.add("flash");
    setTimeout(() => card.classList.remove("flash"), 1600);
  } finally {
    btn.textContent = "RUN THE TRAINER";
    btn.disabled = false;
    trainerBusy = false;
  }
